[package]
name = "forensic-rs"
version = "0.14.0"
authors = ["Samuel Garcés Marín <samuel.garces@protonmail.com>"]
keywords = ["forensic", "windows", "parser", "registry", "cybersecurity"]
categories = ["parsing"]
description = "A Rust-based framework to build tools that analyze forensic artifacts and can be reused as libraries across multiple projects without changing anything."
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/ForensicRS/forensic-rs"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = {version = "1", optional = true}
serde_json = {version = "1", optional = true}

[dev-dependencies]
sqlite = "0.28.1"
anyhow = "1"
criterion = "0.5"
base64 = "0.22"

[[example]]
name = "triage_pipeline"
path = "examples/triage_pipeline.rs"

[[example]]
name = "registry_and_vfs"
path = "examples/registry_and_vfs.rs"

[[example]]
name = "event_gap_detector"
path = "examples/event_gap_detector.rs"

[[example]]
name = "parallel_triage"
path = "examples/parallel_triage.rs"

[[example]]
name = "mcp_stdio_server"
path = "examples/mcp_stdio_server.rs"

[[bench]]
name = "unpack"
harness = false

[[bench]]
name = "timestamp"
harness = false